[project]
name = "signalforge"
version = "0.1.0"
description = "Micro-trend detection and early signal intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "SignalForge Team"}
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pandas",
    "numpy",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "black"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
